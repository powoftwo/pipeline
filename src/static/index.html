<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Pipeline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 680px; margin: 32px auto; padding: 0 16px; color: #111; line-height: 1.4; }
    h1 { font-size: 20px; margin-bottom: 16px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    input, button { font-size: 13px; padding: 6px 10px; }
    button { cursor: pointer; background: #0f172a; color: #fff; border: 1px solid #0f172a; border-radius: 4px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .bar { width: 100%; background: #e2e8f0; height: 12px; border-radius: 3px; overflow: hidden; margin: 6px 0; }
    .bar-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.2s; }
    .box { border: 1px solid #cbd5e1; border-radius: 4px; padding: 12px; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: left; }
    th { background: #f8fafc; }
    video { width: 100%; max-height: 360px; background: #000; border-radius: 4px; margin-top: 10px; }
    .hidden { display: none; }
    .muted { color: #64748b; font-size: 12px; }
    .btn-sm { font-size: 11px; padding: 2px 6px; }
    .btn-warn { background: #d97706; border-color: #d97706; color: #fff; }
    .btn-danger { background: #dc2626; border-color: #dc2626; color: #fff; }
    .timer { font-variant-numeric: tabular-nums; font-family: monospace; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: 500; }
    .badge-waiting { background: #fef3c7; color: #92400e; }
    .badge-active { background: #dbeafe; color: #1e40af; }
    .badge-completed { background: #dcfce7; color: #166534; }
    .badge-failed { background: #fee2e2; color: #991b1b; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tus-js-client@3/dist/tus.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <h1>Adaptive HLS Pipeline</h1>

  <div class="box">
    <div class="row">
      <input type="file" id="fileInput" accept="video/*">
      <button id="btnUpload" onclick="startUpload()">Upload (TUS)</button>
    </div>
    <div class="row muted">
      <label>Segment: <input type="number" id="segDur" value="4" min="1" max="10" style="width:45px">s</label>
      <label><input type="checkbox" id="chkQC" checked> Compute VMAF & XPSNR</label>
      <label><input type="checkbox" id="chkHW"> HW acceleration</label>
    </div>
    <div id="uploadWrap" class="hidden">
      <div class="muted" id="uploadStatus">Upload: 0%</div>
      <div class="bar"><div id="uploadBar" class="bar-fill"></div></div>
    </div>
  </div>

  <div id="queueBox" class="box">
    <div class="row" style="justify-content:space-between; margin-bottom:4px;">
      <strong>Jobs Queue</strong>
      <span id="queueCount" class="muted">0 jobs</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Status</th>
          <th>Time</th>
          <th>Progress</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="queueTbody">
        <tr><td colspan="5" class="muted" style="text-align:center;">No jobs yet</td></tr>
      </tbody>
    </table>
  </div>

  <div id="resultBox" class="box hidden">
    <div class="row" style="justify-content:space-between; margin-bottom:4px;">
      <strong id="resultTitle">Playback & Quality Report</strong>
      <span id="encoderInfo" class="muted"></span>
    </div>
    <video id="videoPlayer" controls playsinline></video>
    <div class="muted" style="margin-top:6px;">Master: <a id="plLink" target="_blank" href="#"></a></div>
    <table>
      <thead>
        <tr>
          <th>Profile</th>
          <th>Resolution</th>
          <th>Bitrate</th>
          <th>VMAF (mean/min)</th>
          <th>XPSNR (Y/min)</th>
        </tr>
      </thead>
      <tbody id="metricsTbody"></tbody>
    </table>
  </div>

  <script>
    let hlsInstance = null;
    let pollTimer = null;
    let activeJobIds = new Set();
    let currentJobId = null;

    function formatDuration(sec) {
      if (sec == null || isNaN(sec)) return "-";
      if (sec < 60) return `${Number(sec).toFixed(1)}s`;
      const m = Math.floor(sec / 60);
      const s = Math.round(sec % 60);
      return `${m}m ${s}s`;
    }

    function formatTimer(sec) {
      sec = Math.max(0, Math.floor(sec));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
    }

    function updateLiveTimers() {
      const now = Date.now();
      document.querySelectorAll(".timer[data-start]").forEach(el => {
        const start = parseInt(el.getAttribute("data-start"), 10);
        if (start > 0) {
          el.textContent = formatTimer((now - start) / 1000);
        }
      });
    }

    setInterval(updateLiveTimers, 1000);

    function schedulePoll(delay = 2000) {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(refreshJobs, delay);
    }

    async function refreshJobs() {
      try {
        const res = await fetch("/api/v1/jobs?limit=20");
        if (res.ok) {
          const jobs = await res.json();
          renderQueue(jobs);
        }
      } catch (_) {}
      const hasActive = activeJobIds.size > 0;
      schedulePoll(hasActive ? 1500 : 4000);
    }

    function renderQueue(jobs) {
      document.getElementById("queueCount").textContent = `${jobs.length} jobs`;
      activeJobIds.clear();
      const tbody = document.getElementById("queueTbody");

      if (!jobs || jobs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;">No jobs yet</td></tr>';
        return;
      }

      tbody.innerHTML = "";
      jobs.forEach(j => {
        if (j.state === "active" || j.state === "waiting") {
          activeJobIds.add(j.id);
        }

        let timeHtml = "-";
        if (j.state === "completed") {
          timeHtml = formatDuration(j.duration_seconds);
        } else if (j.state === "active") {
          const start = j.processed_on || j.timestamp || Date.now();
          const elapsed = (Date.now() - start) / 1000;
          timeHtml = `<span class="timer" data-start="${start}">${formatTimer(elapsed)}</span>`;
        } else if (j.state === "waiting") {
          const start = j.timestamp || Date.now();
          const elapsed = (Date.now() - start) / 1000;
          timeHtml = `<span class="timer muted" data-start="${start}">${formatTimer(elapsed)}</span>`;
        } else if (j.state === "failed") {
          timeHtml = j.duration_seconds ? formatDuration(j.duration_seconds) : "-";
        }

        let progressHtml = "-";
        if (j.state === "active") {
          const p = j.progress || {};
          const pct = p.percent || 0;
          const step = p.step || "processing";
          progressHtml = `
            <div class="bar" style="margin:2px 0; height:8px;"><div class="bar-fill" style="width:${pct}%; background:#059669;"></div></div>
            <span class="muted">${step} (${pct}%)</span>
          `;
        } else if (j.state === "waiting") {
          progressHtml = '<span class="muted">In queue...</span>';
        } else if (j.state === "completed") {
          progressHtml = '<span class="muted">Done (100%)</span>';
        } else if (j.state === "failed") {
          progressHtml = `<span class="muted" style="color:#b91c1c;">${j.failed_reason || "Error"}</span>`;
        }

        let actions = [];
        if (j.state === "completed") {
          actions.push(`<button class="btn-sm" onclick="showJob('${j.id}')">Play & Report</button>`);
          actions.push(`<button class="btn-sm btn-danger" onclick="deleteJob('${j.id}')">Del</button>`);
        } else if (j.state === "active") {
          actions.push(`<button class="btn-sm btn-warn" onclick="cancelJob('${j.id}')">Cancel</button>`);
        } else if (j.state === "waiting") {
          actions.push(`<button class="btn-sm btn-warn" onclick="cancelJob('${j.id}')">Cancel</button>`);
          actions.push(`<button class="btn-sm btn-danger" onclick="deleteJob('${j.id}')">Del</button>`);
        } else if (j.state === "failed") {
          actions.push(`<button class="btn-sm btn-danger" onclick="deleteJob('${j.id}')">Del</button>`);
        }
        const actionHtml = actions.length > 0 ? actions.join(" ") : "-";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><code>${j.id.slice(0, 8)}</code></td>
          <td><span class="badge badge-${j.state}">${j.state}</span></td>
          <td>${timeHtml}</td>
          <td>${progressHtml}</td>
          <td style="white-space:nowrap;">${actionHtml}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function cancelJob(jobId) {
      if (!confirm(`Cancel job ${jobId.slice(0, 8)}?`)) return;
      try {
        await fetch(`/api/v1/jobs/${jobId}/cancel`, { method: "POST" });
        refreshJobs();
      } catch (_) {}
    }

    async function deleteJob(jobId) {
      if (!confirm(`Delete job ${jobId.slice(0, 8)}?`)) return;
      try {
        await fetch(`/api/v1/jobs/${jobId}`, { method: "DELETE" });
        if (currentJobId === jobId) {
          document.getElementById("resultBox").classList.add("hidden");
          currentJobId = null;
        }
        refreshJobs();
      } catch (_) {}
    }

    function startUpload() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) {
        alert("Select video file first");
        return;
      }

      const btn = document.getElementById("btnUpload");
      btn.disabled = true;
      document.getElementById("uploadWrap").classList.remove("hidden");

      const segDur = document.getElementById("segDur").value || "4";
      const chkQC = document.getElementById("chkQC").checked ? "true" : "false";
      const chkHW = document.getElementById("chkHW").checked ? "true" : "false";

      const upload = new tus.Upload(file, {
        endpoint: "/api/v1/tus",
        retryDelays: [0, 1000, 3000, 5000],
        chunkSize: 1024 * 1024,
        metadata: {
          filename: file.name,
          filetype: file.type || "video/mp4",
          segment_duration: segDur,
          compute_quality_metrics: chkQC,
          compute_vmaf: chkQC,
          compute_xpsnr: chkQC,
          hw_accel: chkHW,
          auto_process: "true"
        },
        onError: (err) => {
          document.getElementById("uploadStatus").textContent = "Upload error: " + err;
          btn.disabled = false;
        },
        onProgress: (bytesSent, bytesTotal) => {
          const pct = ((bytesSent / bytesTotal) * 100).toFixed(1);
          document.getElementById("uploadBar").style.width = pct + "%";
          document.getElementById("uploadStatus").textContent = `Upload: ${pct}% (${(bytesSent/1048576).toFixed(1)} / ${(bytesTotal/1048576).toFixed(1)} MB)`;
        },
        onSuccess: () => {
          document.getElementById("uploadStatus").textContent = "Upload complete. Enqueued in BullMQ.";
          const uid = upload.url.split("/").pop();
          pollTusJobId(uid);
        }
      });

      upload.start();
    }

    async function pollTusJobId(uid) {
      for (let i = 0; i < 20; i++) {
        try {
          const res = await fetch(`/api/v1/tus/${uid}`);
          if (res.ok) {
            const data = await res.json();
            if (data.job_id) {
              break;
            }
          }
        } catch (_) {}
        await new Promise(r => setTimeout(r, 600));
      }
      document.getElementById("btnUpload").disabled = false;
      document.getElementById("fileInput").value = "";
      refreshJobs();
      setTimeout(() => {
        document.getElementById("uploadWrap").classList.add("hidden");
      }, 2000);
    }

    async function showJob(jobId) {
      currentJobId = jobId;
      try {
        const res = await fetch(`/api/v1/jobs/${jobId}`);
        if (!res.ok) return;
        const data = await res.json();
        showResult(data.return_value, jobId);
        document.getElementById("resultBox").scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (_) {}
    }

    function showResult(ret, jobId) {
      if (!ret) return;
      document.getElementById("resultBox").classList.remove("hidden");
      document.getElementById("resultTitle").textContent = `Playback: ${jobId ? jobId.slice(0, 8) : ""}`;
      const encInfo = document.getElementById("encoderInfo");
      let infoParts = [];
      if (ret.encoder) {
        infoParts.push(`Encoder: ${ret.encoder} (HW: ${ret.hw_accel ? "on" : "off"})`);
      }
      if (ret.duration_seconds != null) {
        infoParts.push(`Time: ${formatDuration(ret.duration_seconds)}`);
      }
      encInfo.textContent = infoParts.join(" | ");
      const masterUrl = ret.master_playlist_url;
      const plLink = document.getElementById("plLink");
      plLink.href = masterUrl;
      plLink.textContent = masterUrl;

      const video = document.getElementById("videoPlayer");
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(masterUrl);
        hlsInstance.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = masterUrl;
      }

      const tbody = document.getElementById("metricsTbody");
      tbody.innerHTML = "";
      const qreport = (ret.quality_report && ret.quality_report.renditions) || {};

      (ret.renditions || []).forEach(r => {
        const q = (qreport[r.name] && qreport[r.name].metrics) || {};
        const vmaf = q.vmaf || {};
        const xpsnr = q.xpsnr || {};

        const vmafText = vmaf.mean != null ? `${vmaf.mean} / ${vmaf.min}` : "-";
        const xpsnrText = xpsnr.y_db != null ? `${xpsnr.y_db} / ${xpsnr.minimum_db} dB` : "-";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${r.name}</strong></td>
          <td>${r.resolution}</td>
          <td>${r.bitrate_k}k</td>
          <td>${vmafText}</td>
          <td>${xpsnrText}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.addEventListener("DOMContentLoaded", refreshJobs);
  </script>
</body>
</html>
