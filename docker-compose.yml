services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: video-rustfs
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=adminpassword
      - RUSTFS_VOLUMES=/data
      - RUSTFS_OBS_LOGGER_LEVEL=warn
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: video-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bullstudio:
    image: emirce/bullstudio:latest
    container_name: video-bullstudio
    ports:
      - "4000:4000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=video-processing
      - S3_ENDPOINT_URL=http://rustfs:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=adminpassword
      - S3_REGION=us-east-1
      - S3_BUCKET_RAW=videos-raw
      - S3_BUCKET_PROCESSED=videos-processed
    depends_on:
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-worker
    command: python -m src.worker.processor
    environment:
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=video-processing
      - S3_ENDPOINT_URL=http://rustfs:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=adminpassword
      - S3_REGION=us-east-1
      - S3_BUCKET_RAW=videos-raw
      - S3_BUCKET_PROCESSED=videos-processed
      - HLS_SEGMENT_TIME=4
      - COMPUTE_QUALITY_METRICS=true
      - COMPUTE_VMAF=true
      - COMPUTE_XPSNR=true
    depends_on:
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped

volumes:
  rustfs_data:
  redis_data:
